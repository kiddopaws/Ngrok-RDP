name: RDP Ngrok (Auto-Fix Final)

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: 1. Bersihkan Sesi (Mode Aman)
      run: |
        # Script ini mencoba mematikan Ngrok jika ada. 
        # Jika tidak ada, dia akan lanjut (tidak error seperti sebelumnya).
        Stop-Process -Name "ngrok" -Force -ErrorAction SilentlyContinue
        Write-Host "Sesi siap digunakan."

    - name: 2. Download Ngrok V3
      run: |
        # Download langsung dari server resmi
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .
        
    - name: 3. Masukkan Token
      run: |
        .\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: 4. Aktifkan RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: 5. Jalankan Ngrok (Background)
      run: |
        # Jalankan Ngrok di background tanpa log file (biar tidak crash)
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
        
        Write-Host "Ngrok sedang start... Tunggu 10 detik..."
        Start-Sleep -Seconds 10

    - name: 6. AMBIL URL VIA API (Anti Gagal)
      run: |
        $url = $null
        $attempt = 0
        
        # Coba minta URL ke API Ngrok sampai 20 kali
        while ($attempt -lt 20) {
            try {
                # Tanya langsung ke sistem internal Ngrok
                $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
                
                if ($response.tunnels.Count -gt 0) {
                    $rawUrl = $response.tunnels[0].public_url
                    # Hapus awalan tcp:// biar siap copy-paste
                    $url = $rawUrl -replace "tcp://", ""
                    break
                }
            } catch {
                Write-Host "Menunggu tunnel siap... (Detik ke-$($attempt * 2))"
            }
            Start-Sleep -Seconds 2
            $attempt++
        }

        if ($url) {
            echo "RDP_ADDRESS=$url" >> $env:GITHUB_ENV
            Write-Host "✅ SUKSES! URL DITEMUKAN." -ForegroundColor Green
        } else {
            Write-Error "❌ Gagal. Pastikan Token benar dan tidak ada sesi nyangkut di dashboard Ngrok."
            exit 1
        }

    - name: 7. Buat User & Password
      run: |
        $password = "KopiHitam@99"
        $user = "Skyro"
        net user $user $password /add /y
        net localgroup administrators $user /add
        echo "USER_NAME=$user" >> $env:GITHUB_ENV
        echo "USER_PASS=$password" >> $env:GITHUB_ENV

    - name: 🚀 INFO KONEKSI
      run: |
        Write-Host "=============================================" -ForegroundColor Green
        Write-Host "       RDP BERHASIL ONLINE                   " -ForegroundColor Green
        Write-Host "=============================================" -ForegroundColor Green
        Write-Host "Address  : $env:RDP_ADDRESS" -ForegroundColor Yellow
        Write-Host "Username
