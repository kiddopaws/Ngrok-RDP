name: RDP Ngrok V3 (Auto Region)

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Download Ngrok V3
      run: |
        # Download Ngrok V3
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        
        # Ekstrak ke folder 'ngrok-folder' agar rapi
        Expand-Archive ngrok.zip -DestinationPath ngrok-folder
        
        # Masukkan Auth Token
        .\ngrok-folder\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Aktifkan RDP (Registry Fix)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Buat Tunnel Ngrok
      run: |
        # Start Ngrok tanpa flag region (Default Auto)
        # Menambahkan log file untuk berjaga-jaga
        Start-Process -FilePath ".\ngrok-folder\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log" -NoNewWindow
        
        # Tunggu 15 detik agar koneksi stabil
        Start-Sleep -Seconds 15

    - name: Buat User & Password
      run: |
        $password = "KopiHitam@99"
        $user = "Skyro"
        
        net user $user $password /add /y
        net localgroup administrators $user /add
        
        echo "USER_NAME=$user" >> $env:GITHUB_ENV
        echo "USER_PASS=$password" >> $env:GITHUB_ENV

    - name: Ambil Info Koneksi
      run: |
        try {
            $response = Invoke-RestMethod http://localhost:4040/api/tunnels
            $url = $response.tunnels[0].public_url
            $url = $url -replace "tcp://", ""
            echo "RDP_ADDRESS=$url" >> $env:GITHUB_ENV
        } catch {
            # Jika error, tampilkan log ngrok untuk debug
            Write-Error "Gagal ambil URL. Cek log di bawah:"
            Get-Content ngrok.log
            exit 1
        }

    - name: 🚀 INFO LOGIN RDP
      run: |
        Write-Host "============================================="
        Write-Host "       RDP SIAP (Ngrok V3 - Auto Region)     "
        Write-Host "============================================="
        Write-Host "IP Address : $env:RDP_ADDRESS"
        Write-Host "Username   : $env:USER_NAME"
        Write-Host "Password   : $env:USER_PASS"
        Write-Host "============================================="

    - name: Jangan Matikan (Loop)
      run: |
        while ($true) {
            Start-Sleep -Seconds 300
        }
