name: RDP Ngrok V3 (DEBUG MODE)

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Download Ngrok V3
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .
        .\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Aktifkan RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Buat Tunnel Ngrok (Log Output)
      run: |
        # Kita simpan output Ngrok ke file 'ngrok.log' agar bisa dibaca jika error
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp", "3389" -RedirectStandardOutput "ngrok.log" -RedirectStandardError "ngrok.log" -NoNewWindow
        
        Write-Host "Ngrok sedang berjalan... Tunggu 15 detik..."
        Start-Sleep -Seconds 15

    - name: Cek Status & Ambil URL
      run: |
        try {
            # Coba ambil data dari API Ngrok
            $response = Invoke-RestMethod http://localhost:4040/api/tunnels -ErrorAction Stop
            
            # Jika berhasil, ambil URL-nya
            $url = $response.tunnels[0].public_url
            $url = $url -replace "tcp://", ""
            echo "RDP_ADDRESS=$url" >> $env:GITHUB_ENV
            Write-Host "Sukses! URL didapatkan: $url"
        } catch {
            # JIKA GAGAL, TAMPILKAN ISI LOG NGROK
            Write-Error "GAGAL: Ngrok mati atau menolak koneksi. Lihat alasannya di bawah ini:"
            Write-Host "================ ISI LOG NGROK ================"
            if (Test-Path ngrok.log) {
                Get-Content ngrok.log
            } else {
                Write-Host "File log tidak ditemukan."
            }
            Write-Host "==============================================="
            exit 1
        }

    - name: Buat User & Password
      run: |
        $password = "KopiHitam@99"
        $user = "Skyro"
        net user $user $password /add /y
        net localgroup administrators $user /add
        echo "USER_NAME=$user" >> $env:GITHUB_ENV
        echo "USER_PASS=$password" >> $env:GITHUB_ENV

    - name: 🚀 INFO LOGIN RDP
      run: |
        Write-Host "============================================="
        Write-Host "       RDP SIAP (Debug Mode)                 "
        Write-Host "============================================="
        Write-Host "IP Address : $env:RDP_ADDRESS"
        Write-Host "Username   : $env:USER_NAME"
        Write-Host "Password   : $env:USER_PASS"
        Write-Host "============================================="

    - name: Loop
      run: |
        while ($true) { Start-Sleep -Seconds 300 }
