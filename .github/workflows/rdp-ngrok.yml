name: RDP Bore (Tanpa Token - Lebih Stabil)

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Download & Install Bore
      run: |
        # Download Bore (Alternatif Ngrok tanpa akun)
        Invoke-WebRequest https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip -OutFile bore.zip
        Expand-Archive bore.zip -DestinationPath .
        
        # Validasi
        if (-not (Test-Path "bore.exe")) {
            Write-Error "Gagal download bore.exe"
            exit 1
        }

    - name: Aktifkan RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Buat User & Password
      run: |
        $password = "KopiHitam@99"
        $user = "Skyro"
        net user $user $password /add /y
        net localgroup administrators $user /add
        echo "USER_PASS=$password" >> $env:GITHUB_ENV

    - name: Jalankan Tunnel (Bore)
      run: |
        # Jalankan bore dan simpan output ke log untuk diambil port-nya
        Start-Process -FilePath ".\bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "bore.log" -NoNewWindow
        
        Write-Host "Sedang menyambungkan ke server Bore..."
        Start-Sleep -Seconds 10

    - name: 🚀 AMBIL INFO KONEKSI
      run: |
        if (Test-Path bore.log) {
            # Ambil output log
            $logContent = Get-Content bore.log
            
            # Cari baris yang berisi port (Contoh: "listening at bore.pub:12345")
            $match = $logContent | Select-String "listening at bore.pub:[0-9]+"
            
            if ($match) {
                # Bersihkan teks agar cuma sisa addressnya
                $address = $match.Matches.Value.Replace("listening at ", "")
                
                Write-Host "============================================="
                Write-Host "       RDP SIAP (Metode Bore - Tanpa Akun)   "
                Write-Host "============================================="
                Write-Host "Address  : $address"
                Write-Host "Username : Skyro"
                Write-Host "Password : $env:USER_PASS"
                Write-Host "============================================="
            } else {
                Write-Error "Gagal mendapatkan port. Cek log di bawah:"
                Get-Content bore.log
            }
        } else {
            Write-Error "Bore gagal dijalankan."
        }

    - name: Loop (Jangan Mati)
      run: |
        while ($true) { Start-Sleep -Seconds 300 }
