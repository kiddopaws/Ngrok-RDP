name: RDP Ngrok V3 (Simpel & Stabil)

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Download Ngrok V3
      run: |
        # Download Ngrok V3 Terbaru
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        
        # Ekstrak langsung ke folder saat ini (biar path-nya gampang)
        Expand-Archive ngrok.zip -DestinationPath .
        
        # Masukkan Auth Token
        .\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Aktifkan RDP (Registry Fix)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Buat Tunnel Ngrok
      run: |
        # Jalankan Ngrok tanpa argumen aneh-aneh. Cukup tcp 3389.
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp", "3389" -NoNewWindow
        
        # Tunggu 10 detik memastikan koneksi nyambung
        Start-Sleep -Seconds 10

    - name: Buat User & Password
      run: |
        $password = "KopiHitam@99"
        $user = "Skyro"
        
        net user $user $password /add /y
        net localgroup administrators $user /add
        
        echo "USER_NAME=$user" >> $env:GITHUB_ENV
        echo "USER_PASS=$password" >> $env:GITHUB_ENV

    - name: Ambil Info Koneksi
      run: |
        try {
            # Cek API Ngrok untuk ambil URL
            $response = Invoke-RestMethod http://localhost:4040/api/tunnels
            
            # Validasi apakah tunnel ada
            if ($response.tunnels.Count -eq 0) {
                Write-Error "Ngrok berjalan tapi belum ada tunnel. Cek token kamu."
                exit 1
            }

            $url = $response.tunnels[0].public_url
            $url = $url -replace "tcp://", ""
            echo "RDP_ADDRESS=$url" >> $env:GITHUB_ENV
        } catch {
            Write-Error "Gagal konek ke API Ngrok. Kemungkinan Ngrok mati/crash."
            exit 1
        }

    - name: 🚀 INFO LOGIN RDP
      run: |
        Write-Host "============================================="
        Write-Host "       RDP SIAP DIGUNAKAN! (V3 Stable)       "
        Write-Host "============================================="
        Write-Host "IP Address : $env:RDP_ADDRESS"
        Write-Host "Username   : $env:USER_NAME"
        Write-Host "Password   : $env:USER_PASS"
        Write-Host "============================================="

    - name: Jangan Matikan (Loop)
      run: |
        while ($true) {
            Start-Sleep -Seconds 300
        }
