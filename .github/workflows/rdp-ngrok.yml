name: RDP Ngrok v3 Final (Fixed)

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Download Ngrok V3 & Konfigurasi
      run: |
        # UPDATE: Menggunakan Link Download Ngrok V3 (Terbaru)
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip
        
        # UPDATE: Command config untuk versi 3
        .\ngrok\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Aktifkan RDP (Registry Fix)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Buat Tunnel Ngrok (Region AP - Singapore)
      run: |
        # Menjalankan tunnel
        Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp --region ap 3389" -NoNewWindow
        Start-Sleep -Seconds 10

    - name: Buat User & Password
      run: |
        $password = "KopiHitam@99"
        $user = "Skyro"
        
        # Membuat user baru dengan password yang sudah lolos validasi
        net user $user $password /add /y
        net localgroup administrators $user /add
        
        echo "USER_NAME=$user" >> $env:GITHUB_ENV
        echo "USER_PASS=$password" >> $env:GITHUB_ENV

    - name: Ambil Info Koneksi
      run: |
        try {
            # Mengambil URL dari API local Ngrok
            $response = Invoke-RestMethod http://localhost:4040/api/tunnels
            $url = $response.tunnels[0].public_url
            $url = $url -replace "tcp://", ""
            echo "RDP_ADDRESS=$url" >> $env:GITHUB_ENV
        } catch {
            Write-Error "Gagal mengambil URL. Pastikan Token Ngrok benar."
        }

    - name: 🚀 INFO LOGIN RDP
      run: |
        Write-Host "============================================="
        Write-Host "       RDP SIAP (Ngrok V3 - Region AP)       "
        Write-Host "============================================="
        Write-Host "IP Address : $env:RDP_ADDRESS"
        Write-Host "Username   : $env:USER_NAME"
        Write-Host "Password   : $env:USER_PASS"
        Write-Host "============================================="

    - name: Jangan Matikan (Loop)
      run: |
        while ($true) {
            Start-Sleep -Seconds 300
        }
