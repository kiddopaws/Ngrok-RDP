name: RDP Pinggy (Mobile Friendly)

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: 1. Aktifkan RDP & Firewall
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Write-Host "RDP Enabled."

    - name: 2. Buat User & Password
      run: |
        $password = "KopiHitam@99"
        $user = "Skyro"
        net user $user $password /add /y
        net localgroup administrators $user /add
        echo "USER_PASS=$password" >> $env:GITHUB_ENV
        Write-Host "User berhasil dibuat."

    - name: 3. Jalankan Tunnel (Mode Paksa TTY)
      run: |
        Write-Host "Menghubungkan ke Pinggy..."
        
        # Tambahkan flag '-tt' untuk memaksa TTY (supaya banner URL keluar)
        # Output dan Error dipisah ke dua file berbeda agar tidak crash
        $args = "-tt -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -p 443 -R0:localhost:3389 tcp@a.pinggy.io"
        
        Start-Process -FilePath "ssh" -ArgumentList $args -RedirectStandardOutput "pinggy-out.log" -RedirectStandardError "pinggy-err.log" -NoNewWindow
        
        Write-Host "Pinggy berjalan di background. Sedang menunggu URL..."

    - name: 4. CEK URL (Scan Semua Log)
      run: |
        $urlFound = $false
        $attempts = 0
        
        # Loop 30 kali (total 60 detik)
        while ($attempts -lt 30) {
            Start-Sleep -Seconds 2
            $attempts++
            
            # Gabungkan isi kedua log (Output & Error) untuk diperiksa
            $logContent = ""
            if (Test-Path "pinggy-out.log") { $logContent += Get-Content "pinggy-out.log" | Out-String }
            if (Test-Path "pinggy-err.log") { $logContent += Get-Content "pinggy-err.log" | Out-String }
            
            # Cari teks dengan format tcp://...
            if ($logContent -match "tcp://(r.pinggy.io:[0-9]+)") {
                $rawUrl = $matches[0]
                $cleanUrl = $matches[1] # Ambil yang tanpa tcp://
                
                Write-Host "=============================================" -ForegroundColor Green
                Write-Host "       ✅ RDP BERHASIL KONEK!                " -ForegroundColor Green
                Write-Host "=============================================" -ForegroundColor Green
                Write-Host "Address  : $cleanUrl" -ForegroundColor Yellow
                Write-Host "Username : Skyro"
                Write-Host "Password : $env:USER_PASS"
                Write-Host "=============================================" -ForegroundColor Green
                Write-Host "CARA PAKAI DI HP:"
                Write-Host "1. Buka RD Client"
                Write-Host "2. PC Name isi: $cleanUrl"
                Write-Host "3. User Account: Add User > Skyro / $env:USER_PASS"
                
                $urlFound = $true
                break
            }
        }
        
        # Jika setelah 60 detik tidak ketemu juga, tampilkan log-nya biar tahu kenapa
        if (-not $urlFound) {
            Write-Error "❌ Gagal mendapatkan URL. Lihat detail error di bawah:"
            Write-Host "---------------- ISI LOG ERROR ----------------"
            if (Test-Path "pinggy-err.log") { Get-Content "pinggy-err.log" }
            Write-Host "---------------- ISI LOG OUTPUT ---------------"
            if (Test-Path "pinggy-out.log") { Get-Content "pinggy-out.log" }
            exit 1
        }

    - name: 5. Loop (Jaga Tetap Hidup)
      run: |
        while ($true) { Start-Sleep -Seconds 300 }
