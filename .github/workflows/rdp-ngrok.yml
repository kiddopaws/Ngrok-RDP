name: RDP Ngrok (Anti-AFK 6 Jam)

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 # Ini settingan kunci: Maksimal 360 menit (6 jam)

    steps:
    - name: 1. Bersihkan Sesi (Mode Aman)
      run: |
        Stop-Process -Name "ngrok" -Force -ErrorAction SilentlyContinue
        Write-Host "Sesi siap."

    - name: 2. Download Ngrok V3
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .
        
    - name: 3. Masukkan Token
      run: |
        .\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: 4. Aktifkan RDP & Cegah Sleep
      run: |
        # Aktifkan RDP
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
        # Setting agar Windows tidak pernah Sleep/Mati Layar
        powercfg /change monitor-timeout-ac 0
        powercfg /change disk-timeout-ac 0
        powercfg /change standby-timeout-ac 0
        powercfg /change hibernate-timeout-ac 0
        Write-Host "Anti-Sleep berhasil diaktifkan."

    - name: 5. Jalankan Ngrok
      run: |
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
        Write-Host "Ngrok start... Tunggu 10 detik..."
        Start-Sleep -Seconds 10

    - name: 6. AMBIL URL (API Check)
      run: |
        $url = $null
        $attempt = 0
        while ($attempt -lt 20) {
            try {
                $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
                if ($response.tunnels.Count -gt 0) {
                    $rawUrl = $response.tunnels[0].public_url
                    $url = $rawUrl -replace "tcp://", ""
                    break
                }
            } catch {
                Write-Host "Menunggu tunnel... ($attempt)"
            }
            Start-Sleep -Seconds 2
            $attempt++
        }

        if ($url) {
            echo "RDP_ADDRESS=$url" >> $env:GITHUB_ENV
            Write-Host "SUKSES! URL DITEMUKAN."
        } else {
            Write-Error "Gagal ambil URL. Cek Token/Dashboard Ngrok."
            exit 1
        }

    - name: 7. Buat User & Password
      run: |
        $password = "KopiHitam@99"
        $user = "Skyro"
        net user $user $password /add /y
        net localgroup administrators $user /add
        echo "USER_NAME=$user" >> $env:GITHUB_ENV
        echo "USER_PASS=$password" >> $env:GITHUB_ENV

    - name: 🚀 INFO KONEKSI
      run: |
        Write-Host "============================================="
        Write-Host "       RDP SIAP (TARGET: 6 JAM MAX)          "
        Write-Host "============================================="
        Write-Host "Address  : $env:RDP_ADDRESS"
        Write-Host "Username : $env:USER_NAME"
        Write-Host "Password : $env:USER_PASS"
        Write-Host "============================================="

    - name: 8. Loop Anti-AFK (Jaga Tetap Hidup)
      run: |
        $menit = 0
        # Loop selama 360 kali (360 menit = 6 jam)
        while ($menit -lt 360) { 
            $menit++
            # Kirim sinyal log agar GitHub tahu kita masih aktif
            Write-Host "Sesi Aktif... Menit ke-$menit dari 360." 
            
            # Gerakkan tombol virtual (opsional, untuk mencegah idle deep sleep)
            # Tidur selama 60 detik (1 menit)
            Start-Sleep -Seconds 60 
        }
        Write-Host "Waktu Habis! Sesi 6 Jam Selesai."
