name: RDP Ngrok (API Method - Final)

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: 1. Bersihkan Sesi Lama
      run: |
        # Mematikan proses ngrok jika ada yang nyangkut dari run sebelumnya
        taskkill /f /im ngrok.exe 2>$null || echo "Bersih, tidak ada ngrok berjalan."

    - name: 2. Download & Install Ngrok
      run: |
        # Menggunakan Chocolatey (Package Manager resmi Windows) agar instalasi rapi
        choco install ngrok --no-progress --force
        
    - name: 3. Masukkan Token
      run: |
        # Konfigurasi token
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: 4. Aktifkan RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: 5. Jalankan Ngrok (Background)
      run: |
        # Jalankan Ngrok tanpa ribet log file. Biarkan dia jalan di background.
        # Kita tidak perlu membaca output teks-nya.
        Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389" -WindowStyle Hidden
        
        Write-Host "Ngrok sedang start... Tunggu 10 detik..."
        Start-Sleep -Seconds 10

    - name: 6. AMBIL URL VIA API (Anti Gagal)
      run: |
        $url = $null
        $attempt = 0
        
        # Coba minta URL ke API Ngrok sampai 20 kali (total 40 detik)
        while ($attempt -lt 20) {
            try {
                # Ini adalah kuncinya: Kita tanya langsung ke localhost:4040
                $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
                
                # Cek apakah tunnel sudah terbentuk
                if ($response.tunnels.Count -gt 0) {
                    $rawUrl = $response.tunnels[0].public_url
                    # Hapus awalan tcp:// biar siap pakai di HP
                    $url = $rawUrl -replace "tcp://", ""
                    break
                }
            } catch {
                # Jika belum siap, diam dulu
                Write-Host "Menunggu tunnel siap..."
            }
            Start-Sleep -Seconds 2
            $attempt++
        }

        if ($url) {
            echo "RDP_ADDRESS=$url" >> $env:GITHUB_ENV
            Write-Host "✅ SUKSES! URL DITEMUKAN." -ForegroundColor Green
        } else {
            Write-Error "❌ Gagal. Kemungkinan Token Salah atau Akun Ngrok limit (Hapus sesi di dashboard Ngrok)."
            exit 1
        }

    - name: 7. Buat User & Password
      run: |
        $password = "KopiHitam@99"
        $user = "Skyro"
        net user $user $password /add /y
        net localgroup administrators $user /add
        echo "USER_NAME=$user" >> $env:GITHUB_ENV
        echo "USER_PASS=$password" >> $env:GITHUB_ENV

    - name: 🚀 INFO KONEKSI (Screenshot Ini)
      run: |
        Write-Host "=============================================" -ForegroundColor Green
        Write-Host "       RDP BERHASIL ONLINE                   " -ForegroundColor Green
        Write-Host "=============================================" -ForegroundColor Green
        Write-Host "Address  : $env:RDP_ADDRESS" -ForegroundColor Yellow
        Write-Host "Username : $env:USER_NAME"
        Write-Host "Password : $env:USER_PASS"
        Write-Host "=============================================" -ForegroundColor Green
        Write-Host "Masukkan Address (angka & huruf kuning) ke HP."

    - name: 8. Loop (Jangan Mati)
      run: |
        while ($true) { Start-Sleep -Seconds 300 }
